<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inscription</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="container">
    <h1>Inscription</h1>
    <form id="register-form">
      <label>Email</label>
      <input type="email" id="email" required />
      <label>Mot de passe</label>
      <div class="pw-row">
        <input type="password" id="password" required minlength="8" />
        <button id="gen" type="button">Générer</button>
      </div>
      <button type="submit">Créer un compte</button>
    </form>
    <p>Déjà un compte ? <a href="/static/pages/login.html">Se connecter</a></p>
  </div>
  <script src="/static/js/password.js"></script>
  <script>
    const form = document.getElementById('register-form');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const res = await fetch('/auth/register', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      if (!res.ok) {
        const d = await res.json().catch(()=>({detail:'Erreur'}));
        alert(d.detail || 'Erreur');
        return;
      }
      alert('Compte créé, vous pouvez vous connecter.');
      location.href = '/static/pages/login.html';
    });
  </script>
</body>
</html>
