<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin/Compte</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="container">
    <h1>Espace Compte</h1>
    <div id="user-info"></div>

    <section>
      <h2>Créer un compte</h2>
      <select id="acc-type">
        <option value="standard">Standard</option>
        <option value="savings">Épargne</option>
      </select>
      <input id="rate" type="number" step="0.01" placeholder="Taux annuel (%)" />
      <input id="term" type="number" placeholder="Durée (mois)" />
      <button id="create-acc">Créer</button>
    </section>

    <section>
      <h2>Mes comptes</h2>
      <div id="accounts"></div>
    </section>
  </div>

  <script>
    function authHeaders() {
      const t = localStorage.getItem('token');
      return { 'Authorization': 'Bearer ' + t, 'Content-Type': 'application/json' };
    }

    async function fetchMe() {
      const res = await fetch('/auth/me', { headers: authHeaders() });
      if (!res.ok) { location.href = '/static/pages/login.html'; return; }
      const me = await res.json();
      document.getElementById('user-info').textContent = `Connecté: ${me.email}${me.is_admin?' (admin)':''}`;
    }

    async function listAccounts() {
      const res = await fetch('/accounts/', { headers: authHeaders() });
      const list = await res.json();
      const wrap = document.getElementById('accounts');
      wrap.innerHTML = '';
      list.forEach(acc => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `#${acc.id} - ${acc.type} - Solde: ${acc.balance.toFixed(2)} EUR` +
          (acc.type === 'savings' ? ` | Taux: ${acc.annual_rate_percent ?? 0}% | Terme: ${acc.term_months ?? 0}m` : '') +
          `<div class="row">
            <input type="number" step="0.01" placeholder="Montant" class="amt"/>
            <button class="deposit">Déposer</button>
            <button class="withdraw">Retirer</button>
          </div>` +
          (acc.type === 'savings' ? `<div class="row">
            <input type="number" step="0.01" placeholder="Booster (%)" class="boost"/>
            <button class="boost-btn">Booster Taux</button>
          </div>` : '') +
          `<button class="delete">Supprimer</button>`;

        div.querySelector('.deposit').onclick = async () => {
          const amt = parseFloat(div.querySelector('.amt').value||'0');
          if (amt<=0) return alert('Montant invalide');
          const r = await fetch(`/accounts/${acc.id}/deposit`, { method:'POST', headers: authHeaders(), body: JSON.stringify({ amount: amt }) });
          if (!r.ok) return alert('Erreur');
          listAccounts();
        };
        div.querySelector('.withdraw').onclick = async () => {
          const amt = parseFloat(div.querySelector('.amt').value||'0');
          if (amt<=0) return alert('Montant invalide');
          const r = await fetch(`/accounts/${acc.id}/withdraw`, { method:'POST', headers: authHeaders(), body: JSON.stringify({ amount: amt }) });
          const d = await r.json().catch(()=>({detail:'Erreur'}));
          if (!r.ok) return alert(d.detail||'Erreur');
          listAccounts();
        };
        const boostBtn = div.querySelector('.boost-btn');
        if (boostBtn) boostBtn.onclick = async () => {
          const p = parseFloat(div.querySelector('.boost').value||'0');
          if (p<=0) return alert('Pourcentage invalide');
          const r = await fetch(`/accounts/${acc.id}/boost`, { method:'POST', headers: authHeaders(), body: JSON.stringify({ boost_percent: p }) });
          if (!r.ok) return alert('Erreur');
          listAccounts();
        };
        div.querySelector('.delete').onclick = async () => {
          const r = await fetch(`/accounts/${acc.id}`, { method:'DELETE', headers: authHeaders() });
          if (!r.ok) return alert('Erreur');
          listAccounts();
        };

        wrap.appendChild(div);
      });
    }

    document.getElementById('create-acc').onclick = async () => {
      const type = document.getElementById('acc-type').value;
      const rate = parseFloat(document.getElementById('rate').value||'0');
      const term = parseInt(document.getElementById('term').value||'0');
      const payload = { type };
      if (type==='savings') { payload.annual_rate_percent = rate; payload.term_months = term; }
      const res = await fetch('/accounts/', { method:'POST', headers: authHeaders(), body: JSON.stringify(payload) });
      if (!res.ok) return alert('Erreur');
      listAccounts();
    };

    fetchMe();
    listAccounts();
  </script>
</body>
</html>
